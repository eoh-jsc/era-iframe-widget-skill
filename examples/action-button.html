<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg-primary: #1a1a2e;
        --bg-secondary: #16213e;
        --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --success: #00d9a5;
        --text-primary: #ffffff;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: linear-gradient(
          135deg,
          var(--bg-primary) 0%,
          var(--bg-secondary) 100%
        );
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      .action-btn {
        position: relative;
        background: var(--accent-gradient);
        border: none;
        border-radius: 16px;
        padding: 20px 48px;
        color: white;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
      }

      .action-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
      }

      .action-btn:active {
        transform: translateY(-1px);
      }

      .action-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      /* Loading spinner */
      .action-btn .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 2px solid transparent;
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 10px;
      }

      .action-btn.loading .spinner {
        display: inline-block;
      }

      .action-btn.loading .text {
        opacity: 0.7;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Success state */
      .action-btn.success {
        background: var(--success);
      }

      /* Ripple effect */
      .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: scale(0);
        animation: ripple 0.6s linear;
        pointer-events: none;
      }

      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

      .btn-content {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon {
        margin-right: 8px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <button class="action-btn" id="actionBtn">
      <div class="btn-content">
        <span class="spinner"></span>
        <span class="icon">⚡</span>
        <span class="text" id="btnText">Trigger Action</span>
      </div>
    </button>

    <script src="https://www.unpkg.com/@eohjsc/era-widget@1.1.3/src/index.js"></script>
    <script>
      const btn = document.getElementById('actionBtn');
      const btnText = document.getElementById('btnText');

      let action = null;

      const eraWidget = new EraWidget();
      eraWidget.init({
        needRealtimeConfigs: false,
        needHistoryConfigs: false,
        needActions: true,
        maxActionsCount: 1,
        minActionsCount: 1,
        mobileHeight: 150,

        onConfiguration: (configuration) => {
          action = configuration.actions[0];
          if (action) {
            btnText.textContent = action.name || 'Trigger Action';
          }
        },

        onValues: () => {},
      });

      // Ripple effect
      function createRipple(e) {
        const button = e.currentTarget;
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');

        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
        ripple.style.top = e.clientY - rect.top - size / 2 + 'px';

        button.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      }

      btn.addEventListener('click', (e) => {
        if (btn.disabled) return;

        createRipple(e);

        // Show loading state
        btn.classList.add('loading');
        btn.disabled = true;

        // Trigger action
        if (action) {
          eraWidget.triggerAction(action.action, null);
        }

        // Show success after delay
        setTimeout(() => {
          btn.classList.remove('loading');
          btn.classList.add('success');
          btnText.textContent = 'Success!';

          // Reset after 2 seconds
          setTimeout(() => {
            btn.classList.remove('success');
            btn.disabled = false;
            btnText.textContent = action?.name || 'Trigger Action';
          }, 2000);
        }, 1000);
      });
    </script>
  </body>
</html>
